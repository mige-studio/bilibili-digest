<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B站精读 · 我的资料</title><link rel="stylesheet" href="style.css"></head><body class="wide"><header><div class="brand">我的资料 · B站精读</div><a href="options.html">设置</a></header><main><h1>找回读过的视频与原话</h1><p class="muted">按视频与分 P 找回逐字稿、概览和笔记。</p><section class="save-bar"><h2>保存到本机</h2><p id="folder-name" class="muted">尚未选择资料文件夹</p><div class="actions"><button id="choose-folder">选择资料文件夹</button><button id="folder" class="primary">保存全部资料</button></div><p class="muted">按视频标题整理成可阅读文件；内容相同不重复保存，修改后另存副本。</p></section><div class="toolbar"><input id="query" type="search" aria-label="搜索资料和笔记" placeholder="搜索标题、作者、逐字稿和笔记"><button id="reload">刷新列表</button></div><p id="status" role="status"></p><p id="total" class="muted"></p><section id="list"></section><section id="detail" class="library-detail" hidden></section><details class="export-help"><summary>导出与备份有什么区别？</summary><p>“保存全部资料”会把现有视频资料写入选定文件夹；单条“保存到本机”只保存这一条。选择文件夹本身不会写入资料。</p><p>“下载阅读文件”只下载当前视频的 Markdown，可直接阅读或继续加工。</p><p>完整数据备份包含逐字稿、概览、笔记和历史版本，不含任何服务 Key。</p><button id="backup">下载完整数据备份（JSON）</button></details></main><script type="module" src="library.js"></script></body></html>
