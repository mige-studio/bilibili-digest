<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B站精读</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">B站精读</div><div class="tools"><a href="library.html" target="_blank">我的资料</a><a href="options.html" target="_blank">设置</a></div></header>
<section class="identity"><h1 id="title">打开一条 B 站视频</h1><p id="source" class="muted"></p><p id="boundary" class="scope">读取当前分 P，生成带时间点和说话人编号的整段逐字稿。</p></section>
<nav aria-label="阅读导航"><button data-view="text" class="active">逐字稿</button><button data-view="overview">内容概览</button><button data-view="notes">我的笔记</button></nav><p id="status" role="status" aria-live="polite"></p>
<main><section id="engagement" class="engagement" aria-label="当前视频公开互动数据，投币、收藏、评论、分享相对值以点赞为 100" hidden><div id="engagement-counts" class="engagement-counts"></div></section><section id="text"><div class="actions reader-toolbar"><button id="refresh" title="读取当前分 P 的简介及已保存逐字稿，不重复识别声音">刷新当前分 P</button><button id="current-video" hidden>回到播放位置</button><button id="speaker-settings" hidden>对应姓名</button></div><section id="video-controls" hidden><div class="actions" id="generation-actions"><button id="transcribe-video" class="primary">生成说话人逐字稿</button><button id="query-video" hidden>查询转写结果</button></div><details id="transcript-options" hidden><summary>逐字稿选项</summary></details><p id="video-status" class="scope" role="status"></p><details id="video-times" hidden><summary>全部时间点</summary><div id="video-time-list"></div></details></section><div class="searchbar"><input id="search" type="search" aria-label="搜索逐字稿" placeholder="搜索逐字稿"><span id="count"></span><button id="previous" aria-label="上一个结果">↑</button><button id="next" aria-label="下一个结果">↓</button></div><div class="actions transcript-export"><button id="export-video" hidden>导出逐字稿</button></div><div id="body" class="original" tabindex="0"></div></section><section id="overview" hidden></section><section id="notes" hidden></section></main>
<div class="playback-dock"><button id="note-current" hidden title="保存播放点附近的一句原话及时间，更多内容可拖选后记笔记">记下当前原话</button><button id="follow-video" hidden aria-pressed="false">跟随播放：关</button></div>
<div id="selection" class="selection" hidden><button id="explain-selection">解释这段</button><button id="save-selection">记笔记</button><button id="copy-selection">复制原话</button></div>
<dialog id="explanation"><h2>解释这段</h2><blockquote id="explanation-quote"></blockquote><p id="explanation-text"></p><button id="close-explanation">关闭</button></dialog>
<dialog id="speakers"><h2>对应说话人姓名</h2><p class="muted">编号不一定等于真实人数。先回听确认；同一人被分成多个编号时，可填写相同姓名。留空保留编号。</p><div id="speaker-fields"></div><div class="actions"><button id="save-speakers">保存姓名</button><button id="close-speakers">取消</button></div></dialog>
<script type="module" src="panel.js"></script></body></html>
